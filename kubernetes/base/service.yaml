apiVersion: v1
kind: Service
metadata:
  name: cloudcart
  namespace: cloudcart
  labels:
    app.kubernetes.io/name: cloudcart
spec:
  type: NodePort

  selector:
    app.kubernetes.io/name: cloudcart

  ports:
    - name: http
      protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30080