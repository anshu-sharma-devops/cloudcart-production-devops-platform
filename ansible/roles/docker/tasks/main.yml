---
- name: Update the apt package cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install Docker and supporting packages
  ansible.builtin.apt:
    name:
      - docker.io
      - docker-compose-v2
      - git
      - curl
      - ca-certificates
      - unzip
    state: present

- name: Download the official AWS CLI v2 installer
  ansible.builtin.get_url:
    url: https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip
    dest: /tmp/awscliv2.zip
    mode: "0644"

- name: Extract the AWS CLI v2 installer
  ansible.builtin.unarchive:
    src: /tmp/awscliv2.zip
    dest: /tmp
    remote_src: true
    creates: /tmp/aws/install

- name: Install AWS CLI v2
  ansible.builtin.command:
    cmd: /tmp/aws/install
    creates: /usr/local/bin/aws

- name: Verify AWS CLI installation
  ansible.builtin.command:
    cmd: /usr/local/bin/aws --version
  register: aws_cli_version
  changed_when: false

- name: Display AWS CLI version
  ansible.builtin.debug:
    msg: "{{ aws_cli_version.stdout }}"

- name: Ensure Docker is enabled and running
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Add Ubuntu user to Docker group
  ansible.builtin.user:
    name: ubuntu
    groups: docker
    append: true

- name: Verify Docker service status
  ansible.builtin.command:
    cmd: systemctl is-active docker
  register: docker_service_status
  changed_when: false
  failed_when: docker_service_status.stdout != "active"

- name: Display Docker service status
  ansible.builtin.debug:
    msg: "Docker service is {{ docker_service_status.stdout }}"